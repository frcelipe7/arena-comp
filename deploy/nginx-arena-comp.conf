# Arena Comp 2026 em https://feliperaphael.com.br/arena-comp
#
# Arquivos na VPS: conteúdo da pasta out/ em
#   /var/www/feliperaphael.com.br/arena-comp/
# (dentro do "root" do site principal, por isso não é preciso "alias").
#
# Cole estes blocos DENTRO do server com "listen 443 ssl", junto do "location /".
# "^~" garante que o "location /" do site principal (com fallback para
# /index.html) não capture os arquivos do portal.

    location = /arena-comp {
        return 301 /arena-comp/;
    }

    location ^~ /arena-comp/ {
        try_files $uri $uri/ =404;
        error_page 404 /arena-comp/404.html;
    }

    # Arquivos com hash no nome: podem ficar em cache por 1 ano.
    location ^~ /arena-comp/_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
