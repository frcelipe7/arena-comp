# Arena Comp 2026 em https://SEU-DOMINIO/arena-comp/
# Cole dentro do bloco "server { ... }" do site, antes do "location /".
# Use "alias" só se a pasta arena-comp ficar fora da pasta pública (root) do site.

location = /arena-comp {
    return 301 /arena-comp/;
}

location ^~ /arena-comp/ {
    # alias /caminho/completo/arena-comp/;
    try_files $uri $uri/ =404;
    error_page 404 /arena-comp/404.html;
}

location ^~ /arena-comp/_next/static/ {
    # alias /caminho/completo/arena-comp/_next/static/;
    expires 1y;
    add_header Cache-Control "public, immutable";
}
